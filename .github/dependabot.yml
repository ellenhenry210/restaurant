version: 2
updates:
  # Backend npm dependencies — closes the gap where npm vulnerabilities
  # were only ever caught by a manual audit pass (2026-09-17) or CI's own
  # point-in-time `npm audit` on push. This watches continuously between
  # pushes and opens a PR the moment a new CVE is disclosed for something
  # already in package.json.
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend

  # The CI workflow's own actions (checkout, setup-node, etc.) — pinned
  # action versions go stale the same way npm packages do.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
