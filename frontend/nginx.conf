server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compiled static assets (Vite fingerprints filenames on every
    # build), safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real file (a client-side route,
    # once one exists) still serves index.html instead of nginx's own
    # 404 — the standard shape for a single-page app, not yet exercised
    # by this project (no router is wired up yet) but the correct
    # default for when one is.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
